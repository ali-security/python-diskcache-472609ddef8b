name: release

on:
  workflow_dispatch: {}

env:
  PIP_INDEX_URL: https://:2023-08-31T06:11:58.822453Z@time-machines-pypi.sealsecurity.io/

jobs:

  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build
      run: pip install build

    - name: Create build
      run: python -m build

    - name: Upload distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*
        if-no-files-found: error
