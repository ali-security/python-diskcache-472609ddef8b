name: integration

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest selector to run a subset of tests'
        required: false
        default: ''

jobs:

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 8
      matrix:
        check: [bluecheck, doc8, docs, isortcheck, mypy]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install tox
    - name: Run checks with tox
      run: |
        tox -e ${{ matrix.check }}

  tests:
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.8, 3.9, '3.10', 3.11]

    steps:
    - name: Set up Python ${{ matrix.python-version }} x64
      if: runner.os != 'macOS'
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64

    # macos-latest is arm64: x64 CPython 3.8-3.10 builds abort (missing
    # /usr/local/opt/gettext libintl), so provision a native arm64 interpreter.
    - name: Set up Python ${{ matrix.python-version }} (macOS arm64)
      if: runner.os == 'macOS'
      uses: MatteoH2O1999/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache-build: true
        allow-build: allow

    - uses: actions/checkout@v3

    - name: Install tox
      run: |
        pip install --upgrade pip
        pip install tox

    - name: Test with tox
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          tox -e py -x "testenv.commands=pytest --no-cov ${{ inputs.test-filter }}"
        else
          tox -e py
        fi
